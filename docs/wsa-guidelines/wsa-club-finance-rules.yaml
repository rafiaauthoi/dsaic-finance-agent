- id: MON-07
  section: 2. How the money moves
  text: SAF funds are the only money allowed in an RSO's on-campus account; no deposits except to resolve a deficit, and a negative balance freezes the account and the RSO's privileges. Self-generated money (dues, donations) lives in an off-campus bank account under the RSO's own EIN.
