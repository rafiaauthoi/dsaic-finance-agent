- id: BS-10
  section: 13. Open questions, blind spots and gaps
  text: Debt anywhere on campus blocks eligibility. ELG-02 covers any WMU department, not just OSE. A forgotten room charge or library fine on the RSO's account is enough.
  tags:
  - Step 1, Art. 4.01
  - Inferred
