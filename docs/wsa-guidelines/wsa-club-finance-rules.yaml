- id: OTH-01
  section: 4. Funding categories, caps and restrictions
  text: 'Start-Up: $500 for RSOs established not more than a semester (excluding summer). No deliberation required; turn in a brief letter of purpose to the Director and Assistant Director. Unused start-up money expires at the end of the academic year. Restricted to office supplies, on-campus food, publicity, and registration costs such as national organization fees.'
