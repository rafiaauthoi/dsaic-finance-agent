    name: "Yearly cap per RSO, all categories"
    amount_usd: 6500
    per: fiscal_year
    dynamic: true
    dynamic_note: "based on the SAF taken in by WSAAC and the RSOs served"
    sources: [bylaws_f26, step2, cody]
    bylaw: "Art. 6.03(a)"
    trust: official_current
  - id: COL-04
    name: "Collaboration cap, separate from yearly cap"
    amount_usd: 1500
    per: fiscal_year_per_rso
    sources: [bylaws_f26, step2]
    bylaw: "Art. 6.03(a)(iv)(4)"
    trust: official_current
  - id: OTH-01
    name: "Start-Up funding"
    amount_usd: 500
    condition: "RSO established not more than one semester, summer excluded"
    sources: [step2]
    bylaw: "Art. 6.03"
    trust: official_current
  - id: OTH-02
    name: "Bronco Funding (WSAAC internal, not for RSO proposals)"
    amount_usd: 2000
    per: year
    sources: [step2]
    bylaw: "Art. 6.04"
    trust: official_current
  - id: OTH-03
    name: "Sports clubs"
    amount_usd: 0
    eligible_for_wsaac: false
    note: "funded fully by the Sports Club Council; previously $2,000"
    sources: [bylaws_f26]
    bylaw: "Art. 6.03(a)(v)"
    trust: official_current
  - id: CYC-06
    name: "Decision outside deliberation by the Director and Assistant Director"
    amount_usd: null
    condition: "Commission discretion, with a pre-written statement; the older $1,250 threshold was removed"
    sources: [bylaws_f26]
    bylaw: "Art. 7.08"
    trust: official_current
  - id: EVT-01
    name: "Event food per expected attendee"
    amount_usd: 20
    per: expected_attendee
    condition: "on-campus events only (EVT-02)"
    sources: [bylaws_f26, step2, step3]
