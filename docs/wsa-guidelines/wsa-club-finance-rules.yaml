rules_index:
- id: MON-01
  section: 2. How the money moves
  text: Approved allocations are never issued directly to the RSO. Funds are accessed only through OSE.
  tags:
  - Step 7, Art. 8; OSE Spending Guide
- id: MON-02
  section: 2. How the money moves
  text: 'Yearly cap: $6,500 per RSO per fiscal year across all categories. Collaboration funding has its own separate $1,500 cap.'
  tags:
  - Step 2, Art. 6.01, 6.03
  - Cody
- id: MON-03
  section: 2. How the money moves
  text: Funding is supplemental. It is not meant to fully fund an activity, it depends on remaining SAF funds and Commission approval, and WSAAC reserves the right to partially fund or deny. Decisions are based on eligibility, justification and compliance.
  tags:
  - Step 2, Art. 6.01, 6.02
- id: MON-04
  section: 2. How the money moves
  text: Nothing bought before deliberation is covered. The affirmation on every form says no requested items have been purchased yet.
  tags:
  - Step 2, Art. 6
  - Templates F26
- id: MON-05
  section: 2. How the money moves
  text: The Commission will not allocate funds to recover from bad debt or erase pre-existing debt, nor cover expenses incurred before deliberation.
  tags:
  - Bylaws F26 §6.02(a)
- id: MON-06
  section: 2. How the money moves
  text: Approved money expires if not used in the category's window, and expired money cannot be reimbursed.
  tags:
