eligibility:
  - { id: ELG-01, rule: "Registered with OSE for the current academic year", sources: [step1], bylaw: "Art. 4.01", trust: official_current }
  - { id: ELG-02, rule: "No outstanding debt with any WMU department at time of application", sources: [step1], bylaw: "Art. 4.01", trust: official_current }
  - { id: ELG-03, rule: "WSAAC eLearning module completed", sources: [step1], bylaw: "Art. 4.01", trust: official_current }
  - { id: ELG-04, rule: "A WSA Representative in good standing", sources: [step1], bylaw: "Art. 4.01", trust: official_current }
  - { id: ELG-05, rule: "No outstanding documentation from a previously funded WSAAC event or activity", sources: [step1], bylaw: "Art. 4.01", trust: official_current }
  - { id: ELG-06, rule: "Not under a sanction that disqualifies the RSO from funding; the older two-months-per-semester limit is not in the September 2026 bylaws", sources: [bylaws_f26, bylaws_f24, cody], bylaw: "Art. 4.01(f)", trust: official_current, verify: "ask WSAAC whether any per-RSO application limit applies in practice (OQ-01)" }
  - { id: ELG-07, rule: "Not directly receiving SAF funding through another SAF agency, unless a written agreement exists", sources: [step1], bylaw: "Guiding Principles 3; Art. 4", trust: official_current }
  - { id: ELG-08, rule: "Assembly standing is evaluated at the RSO level", sources: [step1], bylaw: "Art. 4.01(d)", trust: official_current }
  - { id: ELG-09, rule: "Any member may attend Assembly on the RSO's behalf; need not be the allocations rep", sources: [step1], bylaw: "Art. 4.01(d)", trust: official_current }
  - { id: ELG-10, rule: "One individual may represent only one RSO in the Assembly", sources: [step1], bylaw: "Art. 4.01(d)", trust: official_current }
  - { id: ELG-11, rule: "Assembly attendance expectations are in the What Is WSA Assembly module; Speaker and Secretary answer standing questions", sources: [step1, step3], trust: official_current }
  - { id: ELG-12, rule: "One designated person completes the allocations process each cycle (submission and deliberation)", sources: [step1], bylaw: "Art. 4", trust: official_current }
  - { id: ELG-13, rule: "One person may complete the process for only one RSO per cycle; a passing quiz applies to that one RSO", sources: [step1], bylaw: "Art. 4; 4.01(e)", trust: official_current }
  - { id: ELG-14, rule: "Complete eLearning modules and score at least 80% on the current Final Allocations Quiz; must be retaken whenever the bylaws change, even if already passed that year; passing does not guarantee funding", sources: [step1, news_0921], bylaw: "Art. 4.01(e)", quiz_min_pct: 80, trust: official_current }
  - { id: ELG-15, rule: "Put the Allocations Representative on the form, not the Assembly rep, unless the same person", sources: [step1], bylaw: "Art. 4", trust: official_current }
  - { id: ELG-16, rule: "Advisors, faculty, staff and community members cannot represent the RSO", sources: [step3, bylaws_f26], bylaw: "Art. 5.04(b)(i)", trust: official_current }
  - { id: ELG-17, rule: "All qualifications, including a passing quiz and good Assembly standing, must be met when the proposal is submitted", sources: [bylaws_f26], bylaw: "Art. 5.04(a)(i)", trust: official_current }
  - { id: ELG-18, rule: "Include documentation that the RSO actively sought outside funding (fundraising, dues, sponsorship outreach, or a written statement of attempts); missing it is grounds for denial", sources: [bylaws_f26], bylaw: "Art. 5.04(g); 7.07(e)", trust: official_current }

categories:
  event:
    purpose: "A specific event open to the WMU student body, free for WMU students, campus-wide benefit; not ongoing operations"
    lead_time_business_days_after_deliberation: 10
    food_allowed: true
    food_conditions: ["on campus only (EVT-02)", "max $20 per expected attendee (EVT-01)"]
    expires: "approved event date; unused funds expire when the event concludes"
    eligible_expenses: ["space or facility rental", "performer, speaker or facilitator fees", "equipment rental (A/V, staging, lighting)", "event supplies and materials", "marketing and promotional materials", "food and refreshments directly related to the event"]
    caps: [EVT-01, EVT-03, EVT-04, EVT-05, EVT-06, EVT-07]
    not_funded:
      - { id: EVT-08, item: "Prizes, giveaways and gift cards", sources: [step2] }
      - { id: EVT-09, item: "Photographers, photobooths or videographers", sources: [step2] }
      - { id: EVT-10, item: "Scholarships and salaries", sources: [step2] }
      - { id: EVT-11, item: "Speakers, performers or artists who are current RSO members", sources: [step2] }
      - { id: EVT-12, item: "Events before 10 business days after the deliberation", sources: [step2] }
      - { id: EVT-13, item: "Events where a political candidate actively campaigns", sources: [step2] }
      - { id: EVT-14, item: "Events that occurred in previous semesters or during the summer", sources: [step2] }
      - { id: EVT-15, item: "All-inclusive vendor services", sources: [bylaws_f26] }
    requirements:
      - { id: EVT-16, rule: "speaker funding needs an introductory statement on intent, value and experience", sources: [bylaws_f26], bylaw: "Art. 5.04(e)" }
      - { id: EVT-17, rule: "estimated attendance must be planned, not inflated; inflation can bring denial or a strike", sources: [bylaws_f26], bylaw: "Art. 6.03(a)(i)(2)(e)-(f); 7.07(d)" }
    sources: [bylaws_f26, step2]
    bylaw: "Art. 6.03(a)(i)"
  operational:
    purpose: "Day-to-day operations: clothing, office supplies, equipment; items must aid the stated mission"
    allowed_categories: ["clothing", "office supplies", "equipment"]
    outside_categories: "justification required (OPS-01)"
    not_for: "any specific program or event (OPS-03)"
    food_allowed: false
    food_note: "Catering for meetings, hot plates and takeout belong in an event proposal (OPS-04)"
    equipment_max_pct_of_budget: 100
    promo_cap: OPS-06
    line_item_flexibility: { id: OPS-07, rule: "amounts may shift between approved line items if the letter total is not exceeded, after consulting WSAAC and getting approval from the Director, Assistant Director or OSE Program Manager", bylaw: "Art. 6.03(a)(iii)(4)" }
    expires: "last day of the semester in which the funding was issued"
    sources: [bylaws_f26, step2, step7]
    bylaw: "Art. 6.03(a)(iii); 5.02(b)"
  conference:
    purpose: "Enrolled students attending a conference for professional development"
    allowed_categories: ["program registration", "transportation", "venue"]
    attendee_requirement: "enrolled at least part-time (CNF-02)"
    required_attachments: ["proof the conference exists", "completed proposal form", "attendee list: first name, last name, WIN (in the template notes box)"]
    lead_time_business_days_after_deliberation: 10
    food_allowed: false
    per_diem_allowed: false
    personal_vehicle: "not considered above WMU mileage rate policy (rate set by Accounts Payable, printed on the travel expense voucher)"
    rental_vehicle: "gas receipts required"
    expires: "approved conference dates; unused funds expire on the date of the conference"
    reschedule_or_cancel: { id: CNF-08, rule: "funds may move to the rescheduled date or return to the cap if unspent, at WSAAC discretion with evidence; not for conferences organized by the RSO or WMU", bylaw: "Art. 5.02(c)" }
    sources: [bylaws_f26, step2, step7, web_travel]
    bylaw: "Art. 6.03(a)(ii)"
  collaboration:
    purpose: "Two to four RSOs putting on one event together"
    rsos_min: 2
    rsos_max: 4
    cap: COL-04
    attendance: "each RSO's WSA representative must attend deliberation or the proposal is dismissed (COL-02)"
    budget: "one form signed by all reps; each RSO states the amount it covers per line item; template has an RSO Purchasing column (COL-03)"
    restrictions: "same as event funding (COL-05)"
    scope: "events held by the RSOs only; not conferences or operational purchases (OQ-08 resolved)"
    sources: [bylaws_f26, step2, templates_f26]
    bylaw: "Art. 6.03(a)(iv)"
  startup:
    cap: OTH-01
    deliberation_required: false
    requirement: "brief letter of purpose to the Director and Assistant Director"
    allowed: ["office supplies", "on-campus food", "publicity", "organization registration cost"]
    expires: "end of the academic year in which it was approved"
    sources: [bylaws_f26, step2]
    bylaw: "Art. 6.03(a)(vi); 5.02(d)"
  bronco:
    cap: OTH-02
    for_rso_proposals: false
    approvers: ["Director of Allocations", "Assistant Director of Allocations", "WSA Chief of Finance"]
    proposal_contents: ["summary of funding purposes", "event details", "cost-benefit analysis", "stakeholder analysis"]
    sources: [step2]
    bylaw: "Art. 6.04"
  sports_club_council:
    cap: OTH-03
    eligible_for_wsaac: false
    definition: "meets two of three: competes toward a national championship, has a governing body, needs risk-management oversight"
    sources: [bylaws_f26]
    bylaw: "Art. 6.03(a)(v)"

