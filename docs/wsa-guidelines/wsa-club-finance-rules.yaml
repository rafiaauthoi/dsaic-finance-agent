  - { id: PRO-02, item: "Weaponry or hazardous materials", sources: [bylaws_f26], bylaw: "GP 9(b)", trust: official_current }
  - { id: PRO-03, item: "Personal benefit of individuals or private corporations", sources: [bylaws_f26], bylaw: "GP 10", trust: official_current }
  - { id: PRO-04, item: "Charitable organizations or programs; fundraising purposes", sources: [bylaws_f26], bylaw: "GP 10", trust: official_current }
  - { id: PRO-05, item: "Financing political candidates or campaigns", sources: [bylaws_f26, step2], bylaw: "GP 10", trust: official_current }
  - { id: PRO-06, item: "Religious purposes (worship, devotional exercises, proselytizing)", sources: [bylaws_f26], bylaw: "GP 10", trust: official_current }
  - { id: PRO-07, item: "Any activity contrary to Michigan or federal law", sources: [bylaws_f26], bylaw: "GP 10", trust: official_current }
  - { id: PRO-09, item: "Fundraisers and materials used in fundraisers", sources: [bylaws_f26], bylaw: "GP 10(a)", trust: official_current }
  - { id: PRO-10, item: "Anything benefiting an RSO advisor or WMU faculty or staff", sources: [bylaws_f26], bylaw: "GP 10(b)", trust: official_current }
  - { id: MON-05, item: "Recovering bad debt, erasing pre-existing debt, or expenses incurred before deliberation", sources: [bylaws_f26], bylaw: "Art. 6.02(a)", trust: official_current }
  - { id: BS-06, item: "Subscriptions (reported removed; no written rule found; OSE card bars auto-recurring payments)", sources: [cody, step7], trust: cody }

cycle:
  cadence: "one dropbox and one deliberation per month"
  deliberations_per_semester_min: 3
  applications_per_semester_max: null
  applications_note: "no per-RSO limit in the September 2026 bylaws; the Fall 2024 limit was 2 plus 1 after a denial (OQ-01)"
  first_come_first_served: true
  proposal_due:
    official: "before the posted eLearning dropbox due date; five university business days before deliberation"
    practice: "first Friday of the month"
    sources: [step3, step4, bylaws_f26, cody]
  deliberation:
    official: "results communicated during deliberation for RSOs required to attend, before it for those not required; no-show or late means not considered"
    practice: "the following Friday; virtual call; quick club intro, explain items, answer flags (logo on items, subscriptions)"
    sources: [step5, bylaws_f24, cody]
  results_and_funding_letter:
    official: "within five university business days after deliberation, emailed to the rep on the proposal"
    practice: "the Friday after deliberation: green light to purchase plus funding letter"
    sources: [step5, bylaws_f24, cody]
