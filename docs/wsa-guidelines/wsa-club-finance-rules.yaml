    trust: official_current
  - id: EVT-04
    name: "Non-WMU performer (travel, lodging, performance)"
    amount_usd: 1000
    sources: [bylaws_f26, step2]
    bylaw: "Art. 6.03"
    trust: official_current
  - id: EVT-05
    name: "Online event"
    amount_usd: 500
    sources: [bylaws_f26, step2]
    bylaw: "Art. 6.03"
