- id: CYC-01
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Proposals are submitted to an eLearning dropbox for each round, one round per month, before the posted due date. Late submissions are not considered.
  tags:
  - Step 3, Art. 5.04
  - Step 4 instr
- id: CYC-02
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: The budget request is due five university business days before the deliberation. After submission, only dates, time, venue, catering details and guest list can be amended, at WSAAC's discretion. Consistent with the observed Friday-to-Friday spacing.
  tags:
  - Bylaws F26 §5.04(a)
- id: CYC-03
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: The Commission Director sends the deliberation schedule to RSOs at least two university business days before the deliberation. Time slots, and funding itself, are first-come, first-served, so submitting early matters.
  tags:
  - Bylaws F26 §5.03(a), 6.01
- id: CYC-04
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: A deliberation session follows. RSOs required to attend hear results during deliberation; RSOs not required to attend hear before it.
  tags:
  - Step 5, Art. 8
- id: CYC-05
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: If no representative is present during the allocated time, the RSO is not considered for funding. An alternative WSA representative may attend if the RSO tells WSAAC before the time slot.
  tags:
  - Bylaws F26 §7.04(a)
- id: CYC-06
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: At the Commission's discretion, the Director and Assistant Director may vote on a request outside deliberations using a pre-written statement covering the deliberation questions; if the RSO is given a deliberation time anyway, the representative must attend. The September 2026 bylaws dropped the older $1,250 threshold.
  tags:
  - Bylaws F26 §7.08
  - Bylaws F24 §7.08
- id: CYC-07
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Changes required by a conditional approval must be made and submitted to the Director and Assistant Director within 24 hours of the deliberation, or as the Commission allows.
  tags:
  - Bylaws F26 §7.06(c)
- id: CYC-08
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Official results and funding letters go out within five university business days after deliberation, by email to the representative on the proposal.
  tags:
  - Step 5, Art. 8
  - Bylaws F26 §8.01
- id: CYC-09
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Dates and updates are posted on the WSA website, the WSAAC Instagram and eLearning "News". The public allocations page still showed a Fall 2023 deliberation-dates heading on 2026-09-24, so eLearning and Instagram are the live channels.
  tags:
  - Step 5, Art. 8
  - 'Web: wmuwsa.org/allocations'
- id: CYC-10
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Funding letters do not determine decisions; they are for recordkeeping and reimbursement.
  tags:
  - Step 5, Art. 8
- id: CYC-11
  section: '5. The monthly cycle: deadlines, deliberation, results'
  text: Each semester has at least three deliberations (summer excluded), with dates set by the Director and posted on the Commission's web page before the semester starts.
  tags:
  - Bylaws F26 §5.01
- id: SUB-01
  section: '6. Building a proposal: the templates and submission rules'
  text: The official WSAAC budget template for the category, with all fields filled.
  tags:
  - Step 3, Art. 5.04
- id: SUB-02
  section: '6. Building a proposal: the templates and submission rules'
  text: Every expense itemized and clearly described; costs accurate, realistic and correctly calculated; items that match the selected category; event food under $20 per expected attendee.
  tags:
  - Step 3, Art. 5.04
- id: SUB-03
  section: '6. Building a proposal: the templates and submission rules'
  text: Estimates, price quotes and menus attached, and they must come directly from the vendor, speaker, etc.
  tags:
  - Step 3, Art. 5.04
- id: SUB-04
  section: '6. Building a proposal: the templates and submission rules'
  text: Submitted in .xlsx only. PDFs, screenshots and editing links are not accepted. Multiple proposals go in separate files, never as multiple sheets in one workbook.
  tags:
  - Step 3, Art. 5.04
  - Step 4 instr
- id: SUB-05
  section: '6. Building a proposal: the templates and submission rules'
  text: Not using the official template, meaningfully modifying it, or leaving it incomplete are each grounds for denial. Unclear or inconsistent budgets can lead to partial funding, conditional funding, or denial.
  tags:
  - Step 3, Art. 5.04, 7.07
- id: SUB-06
  section: '6. Building a proposal: the templates and submission rules'
  text: Submitting is an agreement to comply with the bylaws and an affirmation that everything is accurate and complete.
  tags:
  - Step 3, Art. 5.04
- id: TPL-01
  section: '6. Building a proposal: the templates and submission rules'
  text: 'The affirmation text on every form: "I hereby affirm that all the information provided is accurate and that no items requested have yet been purchased."'
  tags:
  - Templates F26
- id: TPL-02
  section: '6. Building a proposal: the templates and submission rules'
  text: 'Cost vs Amount Requesting: cost is what the item costs, amount requesting is what you are asking WSAAC for. In WSAAC''s own worked example a $29.99 projector is requested at $30.00 and $89.99 of popcorn buckets at $95.00, so modest rounding up appears to be accepted.'
  tags:
  - Step 3
  - Inferred
- id: TPL-03
  section: '6. Building a proposal: the templates and submission rules'
  text: Total SAFs Used divides the total by 20.8692. Neither the templates nor the slides explain the number. It is not the current SAF ($62.00) or the FY2025 SAF ($55.00); the older example on the slides implied a divisor near 66 ($225 shown as 3.41 SAFs). Treat the cell as informational.
  tags:
  - Templates F26
  - Step 3
  - 'Web: wmich.edu'
  - Unconfirmed
- id: TPL-04
  section: '6. Building a proposal: the templates and submission rules'
  text: Yes or no questions (already happened, entrance fee, donations, philanthropic) are there to catch ineligible events early. Date and location cannot be "to be determined" and estimated attendance is required.
  tags:
  - Step 3
  - Templates F26
- id: TPL-05
  section: '6. Building a proposal: the templates and submission rules'
  text: 'Amounts use the accounting number format ($ #,##0.00); the SUM ranges run to row 200 even though only 30 gold rows exist, so extra rows would total but would violate the do-not-modify rule.'
  tags:
  - Templates F26
  - Step 4 instr
- id: SUB-07
  section: '6. Building a proposal: the templates and submission rules'
  text: Submit each budget proposal as an individual .xlsx file in the eLearning dropbox for the corresponding month, before the dropbox due date.
  tags:
  - Step 4 instr
- id: SUB-08
  section: '6. Building a proposal: the templates and submission rules'
  text: Do not submit multiple tabs or sheets in a single .xlsx file; separate proposals are distinct files.
  tags:
  - Step 4 instr
- id: SUB-09
  section: '6. Building a proposal: the templates and submission rules'
  text: All white textboxes must be completely unmodified. Do not delete any rows or columns.
  tags:
  - Step 4 instr
- id: SUB-10
  section: '6. Building a proposal: the templates and submission rules'
  text: All gold textboxes must be filled out completely. Any unused "Item Requesting" gold textboxes must be completely unmodified.
  tags:
  - Step 4 instr
- id: SUB-11
  section: '6. Building a proposal: the templates and submission rules'
  text: Do not write "NA" or "Not Applicable".
  tags:
  - Step 4 instr
- id: SUB-12
  section: '6. Building a proposal: the templates and submission rules'
  text: All "Full RSO Name(s)" must match exactly as displayed on ExperienceWMU.wmich.edu/Organizations. Strictly no abbreviations, no acronyms, no variations.
  tags:
  - Step 4 instr
- id: SUB-13
  section: '6. Building a proposal: the templates and submission rules'
  text: Include the Full RSO Name(s) in each .xlsx file title.
  tags:
  - Step 4 instr
- id: SUB-14
  section: '6. Building a proposal: the templates and submission rules'
  text: All RSO Representative(s), Contact Email(s) and Typed Signature(s) must align line by line.
  tags:
  - Step 4 instr
- id: SUB-15
  section: '6. Building a proposal: the templates and submission rules'
  text: All Contact Email(s) must use an official @wmich.edu domain.
  tags:
  - Step 4 instr
- id: SUB-16
  section: '6. Building a proposal: the templates and submission rules'
  text: Use MM/DD/YYYY for all dates (for example 06/10/2026). Do not spell out dates.
  tags:
  - Step 4 instr
- id: SUB-17
  section: '6. Building a proposal: the templates and submission rules'
  text: Use the Optional Notes section for supplementary details.
  tags:
  - Step 4 instr
- id: SUB-18
  section: '6. Building a proposal: the templates and submission rules'
  text: Include the required Conference Link and Conference List of Attendees (First Name, Last Name, WIN Number).
  tags:
  - Step 4 instr
- id: SUB-19
  section: '6. Building a proposal: the templates and submission rules'
  text: List all applicable Non-Food Items and Food Items in their designated sections, in compliance with the WSAAC Bylaws and eLearning modules.
  tags:
  - Step 4 instr
- id: SUB-20
  section: '6. Building a proposal: the templates and submission rules'
  text: 'Every requested item needs all four details: Item Requesting, Vendor Name, Cost ($), Amount Requesting ($).'
  tags:
  - Step 4 instr
- id: SUB-21
  section: '6. Building a proposal: the templates and submission rules'
  text: Attach all required screenshots, vendor images and item amount quotes outside the colorful border.
  tags:
  - Step 4 instr
- id: SUB-22
  section: '6. Building a proposal: the templates and submission rules'
  text: All Total Requested sections calculate automatically. Do not manually overwrite these formulas.
  tags:
  - Step 4 instr
- id: RES-01
  section: '7. After the decision: funding letters, appeals, strikes'
  text: 'Issued after deliberation by the Director and Assistant Director, emailed to the representative on the proposal, with a detailed breakdown of approved items and amounts (the type of funding and the specific items, for example caterer, printer or booth rental, and the total). Keep it: OSE matches receipts to the approved items, and it is the document the CEAS office wants before handing over their card.'
  tags:
  - Step 5, Art. 8
  - 'Web: wmich.edu/studentengagement/wsaallocationinformation'
  - Cody
- id: APP-01
  section: '7. After the decision: funding letters, appeals, strikes'
  text: 'Grounds: the decision was made in error, in violation of the WSAAC Bylaws, or for reasons beyond the scope of the bylaws. Disagreeing with the outcome is not grounds on its own.'
  tags:
  - Step 5, Art. 8
- id: APP-02
  section: '7. After the decision: funding letters, appeals, strikes'
  text: 'Process: email the intent to appeal to both the Director and Assistant Director mailboxes within 10 business days of notification; the Director provides an appeal form managed by the Chief Justice; fill it out from a @wmich email with the grounds; the Chief Justice reviews and notifies the appellant. The Commission stays out of it unless asked for information.'
  tags:
  - Bylaws F26 §8.04(a)(i)
  - Step 5, Art. 8; Judicial Code
- id: APP-03
  section: '7. After the decision: funding letters, appeals, strikes'
  text: Bylaw-based decisions are reviewed by the Judicial Council and that decision is final. Non-bylaw decisions go to the WSA Assembly, where a two-thirds majority is needed to overturn.
  tags:
  - Step 5, Art. 8
- id: APP-04
  section: '7. After the decision: funding letters, appeals, strikes'
  text: The Fall 2024 version routed appeals to wsa_ac_chair@wmich.edu and wsa_adallocate@wmich.edu, through the Judicial Council to an Appeals Council (Chief Justice, Membership Chair, Chief of Finance) with a 10-business-day decision, then to the Assembly. Sanctioning decisions were appealable the same way. Superseded in the slides; kept for context.
  tags:
  - Bylaws F24 §8.04
- id: STR-01
  section: '7. After the decision: funding letters, appeals, strikes'
  text: Strikes are issued at the Commission's discretion for missing deadlines, failing to submit required documentation, and the violations in Art. 9.01 to 9.03 (the event-sharing rule is called out specifically).
  tags:
  - Step 5, Art. 9
  - Step 6
- id: STR-02
  section: '7. After the decision: funding letters, appeals, strikes'
  text: 'Process: a written statement from the Director or Assistant Director with the reason and next steps, then a meeting with the Director or Assistant Director and the WSA Speaker of the Assembly (or a substitute the Speaker appoints; the older bylaws named the Secretary).'
  tags:
  - Step 5, Art. 9
  - Bylaws F24 §6.03(b)
- id: STR-03
  section: '7. After the decision: funding letters, appeals, strikes'
  text: 'Unresolved strikes can lead to sanctioning, which lasts until the end of the fiscal year or calendar year, whichever comes first. Strikes can be appealed under Art. 8.04 and reset at the end of WMU''s fiscal year. (Fall 2024 text: sanction for the rest of the semester, reset at the start of the academic year.)'
  tags:
  - Step 5, Art. 8, 9
  - Bylaws F26 §9.02
  - Bylaws F24
- id: STR-04
  section: '7. After the decision: funding letters, appeals, strikes'
  text: Sanctions mean removal of access to WSAAC funds, an internal record, and the right to deny funding for the current fiscal year; a sanctioned RSO may apply again the following fiscal year and may face further OSE scrutiny. Falsified documents, harassment, attempts to deceive or manipulate WSAAC, and a third strike are sanctionable outright.
  tags:
  - Bylaws F26 §9.03
- id: STR-05
  section: '7. After the decision: funding letters, appeals, strikes'
  text: Failing to follow funding terms, submit documentation on time, or coordinate payments through OSE can affect reimbursement, future funding, or result in a strike.
  tags:
  - Step 7, Art. 8, 9
- id: BRD-01
  section: 8. Branding and event obligations
  text: 'Display three logos: the WSA logo, the SAF Funded logo, and the WSAAC logo. They go on promotional materials funded by WSAAC and at the event when applicable. Logos are at wmuwsa.org/allocations under "WSAAC Documents".'
  tags:
  - Step 6, Art. 6
- id: BRD-02
  section: 8. Branding and event obligations
  text: All SAF-funded events must include clear acknowledgment of SAF support on publicity materials.
  tags:
  - Step 6, Art. 6
- id: BRD-03
  section: 8. Branding and event obligations
  text: Promotional items must carry the RSO's own branding from the manufacturer or vendor. This is why "are you putting your logo on this?" comes up at deliberation.
  tags:
  - Step 2, Art. 6.03
  - Cody
- id: BRD-04
  section: 8. Branding and event obligations
  text: 'Encouraged channels: social media, flyers and posters, chalk advertising, TVs in the Rec Center and Student Center. wsa-directormarketing@wmich.edu helps with branding, logos and promotion; the older bylaws said RSOs submit publicity materials to the Director of Marketing and Outreach for supervision.'
  tags:
  - Step 6
  - Bylaws F24 §8.02
- id: BRD-05
  section: 8. Branding and event obligations
  text: 'Event sharing: if an event is funded at deliberation, create a public ExperienceWMU event and email the link to the Director and Assistant Director of Allocations by the end of the third business day after deliberation. Missing this may result in a strike.'
  tags:
  - Step 6, Art. 9
- id: PAY-01
  section: 9. Spending the money
  text: 'An RSO member pays out of pocket and submits: an itemized receipt, proof of payment, and documentation matching the approved items. If proof of payment is missing, a bank statement screenshot is required in addition to the receipt.'
  tags:
  - Step 7, OSE Spending Guide; Art. 8
- id: PAY-02
  section: 9. Spending the money
  text: 'Deadline: reimbursement documents to OSE within 10 days after the event or conference; for operational funding, by the last day of the semester it was issued. Missed deadlines can bring strikes and sanctions. The Spring 2026 slides said 10 days from the purchase date, so submitting soon after buying keeps both readings satisfied.'
  tags:
  - Bylaws F26 §7.05(a), 8.03
  - Step 5, Art. 8
- id: PAY-03
  section: 9. Spending the money
  text: 'Typical processing time: 3 to 6 weeks.'
  tags:
  - Step 7, OSE Spending Guide
  - Cody
- id: PAY-04
  section: 9. Spending the money
  text: Send questions, receipts and documents to the OSE Program Manager at ose-financials@wmich.edu.
  tags:
  - Step 7
- id: PAY-05
  section: 9. Spending the money
  text: Only a designated Student Financial Manager (an officer) may sign for and spend RSO account funds.
  tags:
  - Handbook 24-25
- id: PAY-06
  section: 9. Spending the money
  text: The OSE Program Manager can purchase non-food items online, order groceries for curbside pickup, and pay invoiced vendors on a department credit card.
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-07
  section: 9. Spending the money
  text: 'Restrictions: no restaurant food purchases, no payments to individuals, no auto-recurring payments.'
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-08
  section: 9. Spending the money
  text: The RSO must pick items up during business hours and plan ahead.
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-09
  section: 9. Spending the money
  text: 'Independent contractors (DJs, speakers, performers, service providers) must be paid by the university, after services are rendered. RSOs may not pay a contractor themselves and seek reimbursement. Required documents: invoice, W-9, and the Independent Contractor Form if applicable. Attempting to pay individuals directly is one of the listed causes of payment delays.'
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-10
  section: 9. Spending the money
  text: When a WMU department provides the service (facilities, equipment rental, campus services), funds are transferred internally and the Allocation Distribution Request Form is still required. Student Center room charges are handled automatically.
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-11
  section: 9. Spending the money
  text: Event and collaboration money is valid only for the approved event date and expires when the event concludes. Operational money expires the last day of the semester in which it was issued. Conference money is valid only for the approved dates and expires after travel concludes. Expired money cannot be reimbursed.
  tags:
  - Step 7, Art. 8; Spending Guide
  - Bylaws F26 §5.02(b)
- id: PAY-12
  section: 9. Spending the money
  text: Unused or expired funds are returned to the Commission; SAF money left in the on-campus account after an event is swept back to WSAAC.
  tags:
  - Bylaws F26 §5.02(e)
  - Handbook 24-25
- id: PAY-13
  section: 9. Spending the money
  text: 'Delays come from missing or incorrect documentation, expenses outside the approved categories, late submissions, and attempts to pay individuals directly. OSE''s advice: plan early and communicate with them.'
  tags:
  - Step 7, OSE Spending Guide
- id: PAY-14
  section: 9. Spending the money
  text: RSOs are responsible for following the approved funding terms, submitting documentation on time, and coordinating payments through OSE.
  tags:
  - Step 7, Art. 8, 9
