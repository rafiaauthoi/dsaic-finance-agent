- id: BS-01
  section: 13. Open questions, blind spots and gaps
  text: Second funding source. GSA's GFAC funds mixed RSOs (under 50% graduate members) up to $500 operational and $3,000 for events per academic year, if the RSO has been active eight weeks, completed RSO Orientation, and sends a rep to GSA General Assembly (one absence per semester allowed). But WSAAC's rule ELG-07 excludes RSOs that directly receive SAF funding through another SAF agency, and GSA is a SAF agency. Whether GFAC money trips that rule is unanswered; the handbook shows RSOs can hold both a WSAAC (52 627) and a GFAC (52 624) on-campus account, which suggests it is allowed in practice. Ask WSAAC before applying to GFAC.
  tags:
  - 'Web: wmich.edu/gsa'
  - Step 1
  - Handbook 24-25
  - Inferred
- id: BS-02
  section: 13. Open questions, blind spots and gaps
  text: Student Financial Managers. The handbook requires SAF-funded RSOs to designate one or two officers who alone may sign for and spend on-campus funds. The slides never mention it. DSAIC should know who these are and record it.
  tags:
  - Handbook 24-25
- id: BS-03
  section: 13. Open questions, blind spots and gaps
  text: 'On-campus account mechanics. Allocations land in an OSE-held account restricted to the allocated items and swept afterward; no deposits; negative balances freeze privileges. This is the real constraint behind "be vague": the funding letter''s item names are the spend authorization.'
  tags:
  - Handbook 24-25
- id: BS-04
  section: 13. Open questions, blind spots and gaps
  text: Sales tax. WMU is a tax-exempt purchaser when OSE buys directly; a member paying out of pocket pays sales tax, and no source in hand says whether OSE reimburses it. Ask the OSE Program Manager.
  tags:
  - Inferred
- id: BS-05
  section: 13. Open questions, blind spots and gaps
  text: Guiding-principle bans. Alcohol, controlled substances, weapons, personal benefit, charity, fundraising, political and religious purposes are unfundable. The September 2026 bylaws restate them as Guiding Principles 9 and 10, so this gap is closed.
  tags:
  - Bylaws F26, Guiding Principles 9-10
  - Handbook 24-25
- id: BS-06
  section: 13. Open questions, blind spots and gaps
  text: Subscriptions and memberships. No written rule found; Cody reports subscriptions were removed, and the OSE card bars auto-recurring payments. Software, cloud credits and API keys, which DSAIC would plausibly want, sit in this gap.
  tags:
  - Cody
  - Step 7
- id: BS-07
  section: 13. Open questions, blind spots and gaps
  text: Conditional approvals. The bylaws give 24 hours after deliberation to submit required changes, so someone needs to be reachable the day after deliberation.
  tags:
  - Bylaws F26 §7.06(c)
