# Companion to wsa-club-finance-domain.md (canonical text). Same facts, same IDs, same source tags.
# Generated 2026-09-27 for the DSAIC Club Finance project. Never treat a "cody", "inferred" or
# "unconfirmed" trust level as a rule. "bylaws_f26" is the highest source; "bylaws_f24" is history only
# (see changes_to_f26 and changes_f24_to_s26).

