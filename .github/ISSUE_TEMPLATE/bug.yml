name: Bug
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone reproduce it?
      description: The steps you took, in order.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I did not paste any real financial data, names, or account numbers in this issue
          required: true